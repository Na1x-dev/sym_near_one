<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script>
      (function () {
        var root = document.documentElement;
        root.classList.add("is-loading");
        try {
          var theme = localStorage.getItem("portfolio-theme");
          var language = localStorage.getItem("portfolio-language");
          if (theme === "pink") root.dataset.terminalTheme = "pink";
          else delete root.dataset.terminalTheme;
          root.lang = language === "ru" ? "ru" : "en";
        } catch (error) {
          root.lang = "en";
        }
      })();
    </script>
    <meta name="theme-color" content="#080d12" />
    <meta
      name="description"
      content="Projects by Andrew — full-stack web applications and tools."
    />
    <title>[symnearone]</title>
    <link rel="stylesheet" href="style.css" />
    <script src="projects-data.js" defer></script>
    <script src="script.js" defer></script>
    <link rel="icon" type="image/svg+xml" href="sources/favicon.svg" />
  </head>
  <body>
    <header class="site-header">
      <a class="site-header__brand" href="index.html">[sym_near_one.run]</a>
      <button
        class="language-toggle"
        type="button"
        data-language-toggle
        aria-label="Switch language"
      >
        <img
          class="button__icon"
          src="sources/icons/language.svg"
          alt=""
          aria-hidden="true"
        />RU
      </button>
    </header>
    <main class="page-main">
      <div class="section-divider" aria-hidden="true"></div>
      <section class="projects-page">
        <p
          class="section-label"
          data-en="// PROJECT ARCHIVE"
          data-ru="// АРХИВ ПРОЕКТОВ"
        >
          // PROJECT ARCHIVE
        </p>
        <h1 class="page-title">
          <span data-en="Things I've built" data-ru="Мои проекты"
            >Things I've built</span
          ><span class="hero__cursor">_</span>
        </h1>
        <p
          class="page-lead"
          data-en="A collection of applications, experiments, and tools. Each project is a chance to learn something new and solve a practical problem."
          data-ru="Подборка приложений, экспериментов и инструментов. Каждый проект — возможность узнать что-то новое и решить практическую задачу."
        >
          A collection of applications, experiments, and tools. Each project is
          a chance to learn something new and solve a practical problem.
        </p>
        <div class="projects-toolbar">
          <span id="projects-count">Loading projects...</span
          ><a
            class="text-link"
            href="https://github.com/Na1x-dev"
            target="_blank"
            rel="noreferrer"
            data-en="More on GitHub"
            data-ru="Больше на GitHub"
            >More on GitHub</a
          >
        </div>
        <div
          class="projects-grid projects-grid--archive"
          id="all-projects"
        ></div>
      </section>
    </main>
    <footer class="site-footer">
      <span>SymNearOne</span>
      <span data-en="BUILT WITH CURIOSITY" data-ru="СОЗДАНО С ЛЮБОПЫТСТВОМ"
        >BUILT WITH CURIOSITY</span
      >
      <span id="current-year"></span>
    </footer>
  </body>
</html>
