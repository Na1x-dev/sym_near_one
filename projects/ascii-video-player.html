<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script>
      (function () {
        var root = document.documentElement;
        root.classList.add("is-loading");
        try {
          var theme = localStorage.getItem("portfolio-theme");
          var language = localStorage.getItem("portfolio-language");
          if (theme === "pink") root.dataset.terminalTheme = "pink";
          else delete root.dataset.terminalTheme;
          root.lang = language === "ru" ? "ru" : "en";
        } catch (error) {
          root.lang = "en";
        }
      })();
    </script>
    <meta name="description" content="ASCII Video Player — project by Andrew." />
    <title>ASCII Video Player | Andrew</title>
    <link rel="stylesheet" href="../style.css" />
    <script src="../projects-data.js" defer></script>
    <script src="../script.js" defer></script>
    <link rel="icon" type="image/svg+xml" href="../sources/favicon.svg" />
  </head>
  <body>
    <header class="site-header">
      <a class="site-header__brand" href="../index.html">[sym_near_one.run]</a>
      <button class="language-toggle" type="button" data-language-toggle aria-label="Switch language">
        <img class="button__icon" src="../sources/icons/language.svg" alt="" aria-hidden="true" />RU
      </button>
    </header>
    <main class="page-main">
      <div class="section-divider" aria-hidden="true"></div>
      <section class="project-detail" data-project-detail="ascii-video-player"></section>
    </main>
    <footer class="site-footer">
      <span>SymNearOne</span>
      <span data-en="BUILT WITH CURIOSITY" data-ru="СОЗДАНО С ЛЮБОПЫТСТВОМ">BUILT WITH CURIOSITY</span>
      <span id="current-year"></span>
    </footer>
  </body>
</html>
